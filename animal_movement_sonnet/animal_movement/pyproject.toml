[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animal-movement"
version = "0.1.0"
description = "Acoustic telemetry animal movement model in dynestyx"
requires-python = ">=3.12"
dependencies = [
    "dynestyx",
    "jax>=0.6.2",
    "jaxlib>=0.6.2",
    "numpyro>=0.19.0",
    "matplotlib>=3.10.0",
    "numpy>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["animal_movement"]

[tool.uv.sources]
dynestyx = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
